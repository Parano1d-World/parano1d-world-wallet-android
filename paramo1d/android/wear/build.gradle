plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseStore = System.getenv('PARANO1D_ANDROID_KEYSTORE_PATH')

android {
    namespace 'org.parano1d.wear'
    compileSdk 36
    defaultConfig {
        // Same applicationId and signing key as the phone app: the Wearable Data Layer
        // only connects apps with the same package name and signature.
        applicationId 'com.koajent.parano1d.wallet'
        minSdk 30          // Wear OS 3+
        targetSdk 35
        versionCode 100001 // watch = 100000 + the phone's versionCode
        versionName '1.0.0'
    }
    signingConfigs {
        if (releaseStore) {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv('PARANO1D_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('PARANO1D_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('PARANO1D_ANDROID_KEY_PASSWORD') ?: System.getenv('PARANO1D_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Release builds ship only runnable code.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStore) signingConfig signingConfigs.release
        }
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.1'
    implementation 'androidx.compose.ui:ui:1.7.8'
    implementation 'androidx.compose.foundation:foundation:1.7.8'
    implementation 'androidx.wear.compose:compose-material:1.4.1'
    implementation 'androidx.wear.compose:compose-foundation:1.4.1'
    implementation 'androidx.wear:wear-input:1.2.0'
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1'
    implementation 'com.google.zxing:core:3.5.4'
}
