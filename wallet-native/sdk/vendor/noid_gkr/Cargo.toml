[package]
name = "noid_gkr_sdk"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[dependencies]
noid_core = { package = "noid_core_sdk", path = "../noid_core" }
noid_poseidon2b = { package = "noid_poseidon2b_sdk", path = "../noid_poseidon2b" }
noid_fri = { package = "noid_fri_sdk", path = "../noid_fri" }
noid_fri_binius = { package = "noid_fri_binius_sdk", path = "../noid_fri_binius" }
noid_tx = { package = "noid_tx_sdk", path = "../noid_tx" }
rayon = "1.10"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[dev-dependencies]
rand = "0.8"
bincode = "1"
hex = "0.4"
static_assertions = "1.1"
