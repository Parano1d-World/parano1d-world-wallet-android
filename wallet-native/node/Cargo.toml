[package]
name = "paranoid-ios-node"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
[lib]
crate-type = ["staticlib", "rlib"]
[dependencies]
paramo1d = { path = "../../paramo1d" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"
noid_chain = { path = "../../paramo1d/vendor/parano1d/noid_chain" }
noid_core = { path = "../../paramo1d/vendor/parano1d/noid_core" }
noid_tx = { path = "../../paramo1d/vendor/parano1d/noid_tx" }
noid_gkr = { path = "../../paramo1d/vendor/parano1d/noid_gkr" }
paramo1d-courier = { path = "../../paramo1d/courier" }
noid_poseidon2b = { path = "../../paramo1d/vendor/parano1d/noid_poseidon2b" }
noid_miner = { path = "../../paramo1d/vendor/parano1d/noid_miner" }
noid_recursive = { path = "../../paramo1d/vendor/parano1d/noid_recursive" }
blake3 = "1"

